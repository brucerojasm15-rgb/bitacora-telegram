<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zentIA -- despertando</title>
<!-- rama-cortina-instalable: manifest + SW propios de esta página, para
     que "Instalar zentIA" cree un ícono que abre ACÁ (la cortina) y no
     directo en Render -- antes el único manifest instalable era el de la
     app en Render, así que cualquier instalación se saltaba esta cortina
     por completo y mostraba la pantalla de arranque de Render. -->
<link rel="manifest" href="/bitacora-telegram/manifest.json">
<meta name="theme-color" content="#101418">
<link rel="icon" type="image/svg+xml" href="/bitacora-telegram/favicon.svg">
<link rel="apple-touch-icon" href="/bitacora-telegram/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="zentIA">
<style>
  :root {
    color-scheme: light dark;
    --fondo: #101418;
    --tarjeta: #1a2028;
    --texto: #eef2f6;
    --acento: #7fd6a3;
    --acento2: #f4c86b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: radial-gradient(circle at 50% 20%, #1c232c, var(--fondo));
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .tarjeta {
    max-width: 420px;
    width: 100%;
  }
  .mascota-envoltura {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    position: relative;
  }
  .mascota-brillo {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(47, 227, 154, 0.35), transparent 70%);
    filter: blur(6px);
  }
  .mascota {
    position: relative;
    width: 100%;
    height: 100%;
    animation: flotar 2.4s ease-in-out infinite;
  }
  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .mascota svg { width: 100%; height: 100%; display: block; }
  .cola {
    transform-origin: 80% 80%;
    animation: mover-cola 0.6s ease-in-out infinite alternate;
  }
  @keyframes mover-cola {
    from { transform: rotate(-8deg); }
    to { transform: rotate(14deg); }
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .mensaje {
    min-height: 1.4em;
    color: #b9c3cd;
    font-size: 0.98rem;
    margin: 0 0 24px;
  }
  .barra {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: #262f3a;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .barra-relleno {
    height: 100%;
    width: 12%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--acento), var(--acento2));
    transition: width 1.2s ease;
  }
  .segundos {
    font-size: 0.8rem;
    color: #6d7885;
  }
  .enlace-directo {
    display: inline-block;
    margin-top: 22px;
    font-size: 0.82rem;
    color: #6d7885;
  }
  .enlace-directo a { color: #9fb0bf; }
  .boton-instalar-cortina {
    display: block;
    margin: 18px auto 0;
    padding: 10px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--acento), var(--acento2));
    color: #0b1410;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="mascota-envoltura">
      <div class="mascota-brillo" aria-hidden="true"></div>
      <div class="mascota" aria-hidden="true">
        <svg viewBox="0 0 100 100">
          <ellipse class="cola" cx="78" cy="70" rx="14" ry="6" fill="#2fe39a"/>
          <ellipse cx="50" cy="58" rx="34" ry="26" fill="#2fe39a"/>
          <circle cx="34" cy="34" r="12" fill="#2fe39a"/>
          <circle cx="66" cy="34" r="12" fill="#2fe39a"/>
          <ellipse cx="40" cy="48" rx="14" ry="9" fill="#a7f3d4" opacity="0.55"/>
          <circle cx="42" cy="60" r="5" fill="#f4c86b" opacity="0.85"/>
          <circle cx="58" cy="60" r="5" fill="#f4c86b" opacity="0.85"/>
          <circle cx="34" cy="34" r="6" fill="#0b3d2a"/>
          <circle cx="66" cy="34" r="6" fill="#0b3d2a"/>
          <circle cx="42" cy="56" r="4" fill="#0b3d2a"/>
          <circle cx="58" cy="56" r="4" fill="#0b3d2a"/>
          <path d="M46 66 Q50 70 54 66" stroke="#0b3d2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <h1>Despertando el servidor</h1>
    <p class="mensaje" id="mensaje">Dándole de comer...</p>
    <div class="barra"><div class="barra-relleno" id="barra"></div></div>
    <p class="segundos" id="segundos">0s</p>
    <p class="enlace-directo">¿Se está tardando mucho? <a href="https://bitacora-telegram.onrender.com" id="enlace-manual">Entrar directo</a></p>
  </div>

<script>
  var DESTINO = 'https://bitacora-telegram.onrender.com';
  var mensajes = [
    'Dándole de comer...',
    'Estirando las patas...',
    'Abriendo los ojos...',
    'Calentando motores...',
    'Ya casi, un ratito más...',
    'Preparando tus pendientes...',
    'Últimos ajustes...'
  ];
  var elMensaje = document.getElementById('mensaje');
  var elBarra = document.getElementById('barra');
  var elSegundos = document.getElementById('segundos');
  var inicio = Date.now();
  var listo = false;

  function actualizarProgreso() {
    var s = Math.floor((Date.now() - inicio) / 1000);
    elSegundos.textContent = s + 's';
    var pct = Math.min(92, 12 + s * 1.8);
    elBarra.style.width = pct + '%';
    var idx = Math.min(mensajes.length - 1, Math.floor(s / 8));
    elMensaje.textContent = mensajes[idx];
  }

  function irAlDestino() {
    if (listo) return;
    listo = true;
    elBarra.style.width = '100%';
    elMensaje.textContent = '¡Listo! Entrando...';
    window.location.href = DESTINO;
  }

  // rama-fix-cortina-render: el bug original -- ping con
  // <img src="/favicon.ico"> tratando onload Y onerror como "ya está
  // lista". /favicon.ico nunca existió en la app real (redirige a
  // /login), así que onerror se disparaba siempre, tanto con Render
  // dormido como despierto, y la cortina redirigía casi de inmediato sin
  // esperar de verdad.
  //
  // rama-cortina-instalable: se probó primero un fetch() real contra un
  // endpoint /salud dedicado (con CORS) -- funcionaba perfecto por curl,
  // pero probado de verdad en un navegador real (Brave) devolvía 503 o
  // directamente "Failed to fetch" de forma intermitente, mientras un
  // <img> pedido al mismo tiempo cargaba sin problema. La explicación más
  // probable: Cloudflare (delante de Render, confirmado en los headers)
  // trata un fetch()/XHR cross-origin distinto de una carga de
  // sub-recurso como <img> -- probado 5 veces seguidas, <img> nunca
  // falló mientras fetch() fallaba la mayoría de las veces. Se vuelve al
  // patrón <img>, pero corrigiendo el bug real: apunta a /favicon.svg
  // (que SÍ existe de verdad en la app -- confirmado con curl, 200
  // image/svg+xml) en vez de /favicon.ico, y ahora onload/onerror
  // significan lo que deberían: onload = la app respondió con una
  // imagen real = lista; onerror = todavía no (Render sirve su propio
  // placeholder HTML, que nunca carga como imagen válida) = reintentar.
  function intentar() {
    if (listo) return;
    var img = new Image();
    var terminado = false;
    var vencer = setTimeout(function () {
      if (!terminado) { terminado = true; programarSiguiente(); }
    }, 5000);
    img.onload = function () {
      if (terminado) return;
      terminado = true;
      clearTimeout(vencer);
      irAlDestino();
    };
    img.onerror = function () {
      if (terminado) return;
      terminado = true;
      clearTimeout(vencer);
      programarSiguiente();
    };
    img.src = DESTINO + '/favicon.svg?t=' + Date.now();
  }

  function programarSiguiente() {
    if (listo) return;
    setTimeout(intentar, 2500);
  }

  setInterval(actualizarProgreso, 500);
  intentar();

  // rama-cortina-instalable: registra el SW propio de esta página (ver
  // docs/sw.js) para que sea instalable, y ofrece el prompt nativo si el
  // navegador lo dispara -- mismo patrón que public/instalar.js de la app
  // real, pero acá en vez de allá, para que lo que se instale sea ESTA
  // página (la cortina) y no la app de Render directo.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/bitacora-telegram/sw.js').catch(function () {});
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    var boton = document.createElement('button');
    boton.type = 'button';
    boton.textContent = 'Instalar zentIA';
    boton.className = 'boton-instalar-cortina';
    boton.addEventListener('click', function () {
      e.prompt();
      boton.remove();
    });
    document.querySelector('.tarjeta').appendChild(boton);
  });
</script>
</body>
</html>
