<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — zentIA</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#2D5A3D">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <main class="login-main">
    <div class="login-card">
      <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Ilustración de una hoja de monstera">
        <defs>
          <mask id="offline-mask">
            <rect x="0" y="0" width="100" height="100" fill="white"></rect>
            <ellipse cx="42" cy="34" rx="6" ry="9" fill="black"></ellipse>
            <ellipse cx="62" cy="30" rx="5" ry="8" fill="black" transform="rotate(20 62 30)"></ellipse>
            <ellipse cx="38" cy="58" rx="5" ry="8" fill="black" transform="rotate(-15 38 58)"></ellipse>
            <ellipse cx="60" cy="60" rx="6" ry="9" fill="black" transform="rotate(12 60 60)"></ellipse>
          </mask>
        </defs>
        <path d="M50 8 C74 10 90 30 88 52 C86 76 66 92 48 90 C26 88 10 70 12 48 C14 26 30 6 50 8 Z"
              fill="var(--accent)" mask="url(#offline-mask)"></path>
      </svg>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Cuando vuelva la señal, volvé a intentar.</p>
      <!-- rama-captura-offline: esta página solo aparece para navegaciones
           que el service worker no sabe servir sin red -- si ya visitaste
           /captura antes con conexión, ESA sí carga offline (queda
           cacheada), así que vale la pena ofrecer el atajo acá. -->
      <p><a href="/captura">Ir a Captura rápida</a> -- si ya la abriste antes, funciona sin conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </main>
</body>
</html>
